<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势选择 - Scene Editor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <a href="/" class="home-link">← 返回首页</a>

        <div class="header-row">
            <h1>Scene 修改</h1>
            <div class="step-indicator">第一步：选择 gesture</div>
        </div>

        <!-- Search box -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索框">
        </div>

        <!-- Category tabs -->
        <div class="tabs" id="categoryTabs">
            <!-- Tabs will be generated dynamically -->
        </div>

        <!-- Gesture grid -->
        <div class="grid" id="gestureGrid">
            <!-- Gestures will be loaded dynamically -->
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
            <!-- Pagination controls will be generated dynamically -->
        </div>
    </div>

    <script>
        let allGestures = [];
        let categories = [];
        let currentCategory = 'all';
        let currentPage = 1;
        const itemsPerPage = 12;

        // Load gestures data
        async function loadGestures() {
            const response = await fetch('/api/gestures');
            const data = await response.json();
            allGestures = data.gestures;
            categories = data.categories;

            // Restore state if returning from editor
            const savedPage = sessionStorage.getItem('gestureListPage');
            const savedCategory = sessionStorage.getItem('gestureListCategory');
            const savedScrollPosition = sessionStorage.getItem('gestureListScrollPosition');

            if (savedPage !== null) {
                currentPage = parseInt(savedPage);
                sessionStorage.removeItem('gestureListPage');
            }

            if (savedCategory !== null) {
                currentCategory = savedCategory;
                sessionStorage.removeItem('gestureListCategory');
            }

            renderTabs();
            renderGestures();

            if (savedScrollPosition !== null) {
                setTimeout(() => {
                    window.scrollTo(0, parseInt(savedScrollPosition));
                    sessionStorage.removeItem('gestureListScrollPosition');
                }, 100);
            }
        }

        // Render category tabs
        function renderTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = categories.map(cat =>
                `<button class="tab ${cat === 'all' ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</button>`
            ).join('');
        }

        // Select category
        function selectCategory(category) {
            currentCategory = category;
            currentPage = 1;

            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent === category);
            });

            renderGestures();
        }

        // Render gestures
        function renderGestures() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allGestures.filter(g => {
                const matchCategory = currentCategory === 'all' || g.category === currentCategory;
                const matchSearch = g.name.toLowerCase().includes(searchTerm);
                return matchCategory && matchSearch;
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedItems = filtered.slice(startIndex, endIndex);

            const grid = document.getElementById('gestureGrid');
            grid.innerHTML = paginatedItems.map(gesture => `
                <div class="card" onclick="selectGesture('${gesture.name}')">
                    <div class="card-image">
                        <img src="${gesture.image}" alt="${gesture.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23ddd%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22%3ENo Image%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div class="card-label">${gesture.name}</div>
                </div>
            `).join('');

            renderPagination(totalPages, filtered.length);
        }

        // Render pagination controls
        function renderPagination(totalPages, totalItems) {
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `<div class="pagination-info">共 ${totalItems} 项，第 ${currentPage}/${totalPages} 页</div>`;
            html += '<div class="pagination-controls">';

            // Previous button
            html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">上一页</button>`;

            // Page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            if (endPage - startPage < maxVisiblePages - 1) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            if (startPage > 1) {
                html += `<button class="pagination-btn" onclick="changePage(1)">1</button>`;
                if (startPage > 2) html += '<span class="pagination-ellipsis">...</span>';
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += '<span class="pagination-ellipsis">...</span>';
                html += `<button class="pagination-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
            }

            // Next button
            html += `<button class="pagination-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">下一页</button>`;

            html += '</div>';
            pagination.innerHTML = html;
        }

        // Change page
        function changePage(page) {
            currentPage = page;
            renderGestures();
            window.scrollTo(0, 0);
        }

        // Select gesture and navigate to editor
        function selectGesture(gestureName) {
            // Save current state
            sessionStorage.setItem('gestureListScrollPosition', window.scrollY);
            sessionStorage.setItem('gestureListPage', currentPage);
            sessionStorage.setItem('gestureListCategory', currentCategory);
            window.location.href = `/scene/editor/${encodeURIComponent(gestureName)}`;
        }

        // Search input handler
        document.addEventListener('DOMContentLoaded', () => {
            loadGestures();

            document.getElementById('searchInput').addEventListener('input', () => {
                currentPage = 1;
                renderGestures();
            });
        });
    </script>
</body>
</html>
