services:
  lance-viz-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lance-viz-api:latest
    container_name: lance-viz-api
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8868}:${APP_PORT:-8868}"
    volumes:
      # 源代码热挂载（开发时修改无需重新 build）
      - ../app.py:/app/app.py:ro
      - ../core:/app/core:ro
      - ../frontend:/app/frontend:ro
      # 应用配置（挂载到 config.py 首选查找路径）
      - ../viz_config.yaml:/data/viz_config.yaml:ro
      # 标注数据目录（可读写，持久化到宿主机）
      - ${HOST_ANNOTATIONS_PATH:-../annotations}:/app/annotations
      # 资源与数据挂载
      - ${HOST_ASSETS_PATH:-../assets}:/app/assets:ro
      - ${HOST_DATA_PATH}:/data:ro
      - ${HOST_NAS_PATH}:/mnt/nas-222-project:ro
      - ${HOST_NAS_PATH}:/mnt/nas-222:ro
    restart: unless-stopped
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port ${APP_PORT:-8868}
      --timeout-keep-alive 300
      --limit-concurrency 100
    environment:
      - TZ=${TZ:-Asia/Shanghai}
