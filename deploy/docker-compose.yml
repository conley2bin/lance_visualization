services:
  human-viz-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 基础镜像源：默认 Docker Hub；公司内网在 .env 设 BASE_IMAGE 改用 Harbor 缓存
        - BASE_IMAGE=${BASE_IMAGE:-python:3.10}
    image: human-viz:latest
    container_name: human-viz
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8868}:${APP_PORT:-8868}"
    volumes:
      # 源代码热挂载（开发时修改无需重新 build）
      - ../app.py:/app/app.py:ro
      - ../core:/app/core:ro
      - ../frontend:/app/frontend:ro
      # 资源与数据挂载
      - ${HOST_ASSETS_PATH:-../assets}:/app/assets:ro
      - ${HOST_DATA_PATH}:/data:ro
      # 默认与 HOST_DATA_PATH 相同；内网 NAS 场景在 .env 设置 HOST_NAS_PATH
      - ${HOST_NAS_PATH:-${HOST_DATA_PATH}}:/mnt/nas-222-project:ro
      - ${HOST_NAS_PATH:-${HOST_DATA_PATH}}:/mnt/nas-222:ro
    restart: unless-stopped
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port ${APP_PORT:-8868}
      --timeout-keep-alive 300
      --limit-concurrency 100
    environment:
      - TZ=${TZ:-Asia/Shanghai}
