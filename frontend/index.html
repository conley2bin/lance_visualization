<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>真人Lance数据可视化</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #e8eaed; color: #2c3e50;
  font-family: 'Segoe UI', sans-serif; font-size: 13px;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* ── 顶栏 ── */
#topbar {
  background: #f8f9fa; border-bottom: 1px solid #dee2e6;
  padding: 7px 14px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
#topbar h1 { font-size: 14px; color: #1890ff; white-space: nowrap; }
#traj-select { flex: 1; max-width: 480px; background: #ffffff; color: #2c3e50; border: 1px solid #dee2e6; border-radius: 4px; padding: 4px 8px; }
#traj-info { color: #7f8c8d; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#source-wrap { margin-left: auto; display: flex; align-items: center; gap: 5px; min-width: 340px; max-width: 520px; flex: 0 1 42%; }
#source-picker-wrap { position: relative; min-width: 0; flex: 1; }
#source-path { width: 100%; min-width: 0; background: #ffffff; color: #2c3e50; border: 1px solid #dee2e6; border-radius: 4px; padding: 4px 8px; font-size: 12px; outline: none; }
#source-path:focus { border-color: #1890ff; }
.top-btn { padding: 4px 9px; border: 1px solid #d9dee4; background: #ffffff; color: #2c3e50; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.top-btn:hover { border-color: #1890ff; color: #1890ff; }
#btn-source-load { background: #1890ff; color: #fff; border-color: #1890ff; }
#btn-source-load:hover { background: #096dd9; color: #fff; }
#source-dropdown {
  display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 999;
  background: #ffffff; border: 1px solid #dee2e6; border-radius: 4px;
  max-height: 320px; overflow-y: auto; margin-top: 2px;
}
#source-dropdown.open { display: block; }
.source-item {
  padding: 7px 8px; cursor: pointer; font-size: 12px;
  border-bottom: 1px solid #f1f5f9;
}
.source-item:last-child { border-bottom: none; }
.source-item:hover, .source-item.active { background: #f8f9fa; }
.source-item-main {
  color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.source-item-sub {
  color: #94a3b8; font-size: 10px; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── 轨迹搜索 ── */
#traj-search-wrap { position: relative; flex: 1; max-width: 480px; }
#traj-search { width: 100%; background: #ffffff; color: #2c3e50; border: 1px solid #dee2e6; border-radius: 4px; padding: 4px 8px; outline: none; }
#traj-search:focus { border-color: #1890ff; }
.search-mode {
  display: inline-flex; border: 1px solid #d9dee4; border-radius: 4px; overflow: hidden;
  background: #ffffff; flex: 0 0 auto;
}
.search-mode-btn {
  border: none; background: #ffffff; color: #64748b; padding: 4px 8px;
  font-size: 12px; cursor: pointer; border-right: 1px solid #e5e7eb;
}
.search-mode-btn:last-child { border-right: none; }
.search-mode-btn.active { background: #e6f4ff; color: #096dd9; font-weight: 600; }
#btn-toggle-index.active { background: #e6f4ff; color: #096dd9; border-color: #91caff; }
#index-detail-panel {
  display: none; position: fixed; top: 42px; left: 14px; z-index: 1000;
  width: min(620px, calc(100vw - 28px)); max-height: 360px; overflow-y: auto;
  background: #ffffff; border: 1px solid #d8dee6; border-radius: 6px;
  box-shadow: 0 16px 38px rgba(15, 23, 42, 0.18); padding: 8px 10px;
}
#index-detail-panel.open { display: block; }
.index-detail-title { color: #1890ff; font-size: 11px; font-weight: 700; margin-bottom: 6px; }
.index-detail-row {
  display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 8px;
  padding: 3px 0; border-top: 1px solid #f1f5f9; font-size: 11px;
}
.index-detail-key { color: #64748b; font-weight: 600; }
.index-detail-value { color: #1f2937; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#traj-dropdown {
  display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 999;
  background: #ffffff; border: 1px solid #dee2e6; border-radius: 4px;
  max-height: 260px; overflow-y: auto; margin-top: 2px;
}
#traj-dropdown.open { display: block; }
.traj-item { padding: 5px 8px; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.traj-item:hover, .traj-item.active { background: #f8f9fa; color: #1890ff; }

/* ── 数据源浏览弹窗 ── */
#source-modal {
  position: fixed; inset: 0; z-index: 1200;
  background: rgba(17, 24, 39, 0.42);
  display: flex; align-items: center; justify-content: center;
}
#source-modal.hidden { display: none; }
.source-dialog {
  width: min(760px, calc(100vw - 36px));
  height: min(620px, calc(100vh - 44px));
  background: #ffffff; border-radius: 8px; border: 1px solid #d8dee6;
  box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25);
  display: flex; flex-direction: column; overflow: hidden;
}
.source-dialog-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-bottom: 1px solid #e5e7eb;
}
.source-dialog-title { color: #1890ff; font-size: 12px; font-weight: bold; }
#btn-source-close { flex: 0 0 auto; padding: 3px 8px; }
.source-browser-bar {
  display: flex; gap: 6px; padding: 9px 12px; border-bottom: 1px solid #eef2f7;
}
#browser-path { flex: 1; min-width: 0; border: 1px solid #dee2e6; border-radius: 4px; padding: 5px 8px; font-size: 12px; }
#browser-roots {
  display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid #eef2f7;
}
.root-chip {
  border: 1px solid #d7dde5; border-radius: 999px; background: #f8fafc;
  color: #475569; padding: 3px 9px; font-size: 11px; cursor: pointer;
}
.root-chip:hover { border-color: #1890ff; color: #1890ff; }
#browser-list { flex: 1; overflow-y: auto; padding: 6px; background: #fbfcfd; }
.browser-item {
  display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: 5px; cursor: pointer; font-size: 12px;
}
.browser-item:hover { background: #eef6ff; }
.browser-item-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.browser-item-path { color: #94a3b8; font-size: 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.browser-select-btn {
  border: none; border-radius: 4px; background: #1890ff; color: #fff;
  padding: 4px 9px; font-size: 11px; cursor: pointer;
}
.browser-select-btn:hover { background: #096dd9; }
.browser-empty { color: #94a3b8; padding: 22px; text-align: center; font-size: 12px; }

/* ── 主体 ── */
#main {
  flex: 1; display: grid;
  grid-template-columns: 210px minmax(360px, 3fr) minmax(560px, 2fr);
  grid-template-rows: 1fr 190px;
  gap: 3px; padding: 3px; overflow: hidden; min-height: 0;
}

/* ── 左侧控制 ── */
#controls {
  grid-row: 1 / 3; background: #ffffff; border-radius: 6px; border: 1px solid #dee2e6;
  padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
}
.sec { border-bottom: 1px solid #ecf0f1; padding-bottom: 10px; }
.sec:last-child { border-bottom: none; }
.sec-title { color: #1890ff; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

#frame-slider { width: 100%; accent-color: #1890ff; cursor: pointer; margin: 4px 0; }
#frame-label { color: #7f8c8d; font-size: 11px; }

.play-row { display: flex; gap: 5px; margin-top: 6px; }
.btn { flex: 1; padding: 5px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
#btn-play { background: #1890ff; color: #fff; }
#btn-pause { background: #f8f9fa; color: #2c3e50; }
#btn-play:hover { background: #096dd9; }
#btn-pause:hover { background: #dde1e3; }

.cb-group { display: flex; flex-direction: column; gap: 3px; }
.cb-row { display: flex; align-items: center; gap: 6px; cursor: pointer; line-height: 1.6; }
.cb-row input { accent-color: #1890ff; cursor: pointer; }

select.small { width: 100%; background: #ffffff; color: #2c3e50; border: 1px solid #dee2e6; border-radius: 4px; padding: 3px 6px; margin-top: 3px; }
#curve-select { height: 110px; }

/* ── 3D 视口 ── */
#viewport {
  grid-column: 2; grid-row: 1;
  background: #14181f; border-radius: 6px; overflow: hidden; position: relative;
}
#three-canvas { width: 100%; height: 100%; display: block; }
#viewport-hint { position: absolute; bottom: 6px; right: 8px; color: #bfbfbf; font-size: 10px; pointer-events: none; }
.axis-lbl { position: absolute; font-size: 10px; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap; }
.object-axis-lbl { font-size: 11px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.85); }
#object-pose-overlay {
  position: absolute; top: 8px; left: 8px; z-index: 3; pointer-events: none;
  min-width: 238px; max-width: min(320px, calc(100% - 16px));
  background: rgba(12, 18, 27, 0.82); border: 1px solid rgba(148, 163, 184, 0.28);
  color: #e5edf7; border-radius: 6px; padding: 8px 9px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  box-shadow: 0 10px 26px rgba(0,0,0,0.22);
}
#object-pose-overlay.hidden { display: none; }
.pose-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.pose-title span:first-child { color: #cbd5e1; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; }
.pose-title span:last-child { color: #94a3b8; font-size: 10px; }
.pose-grid { display: grid; grid-template-columns: 54px repeat(3, minmax(0, 1fr)); gap: 4px 7px; align-items: baseline; font-size: 10px; }
.pose-grid .pose-label { color: #93a4b8; }
.pose-grid .pose-value { color: #f8fafc; text-align: right; font-variant-numeric: tabular-nums; }
.pose-axis-legend { display: flex; gap: 10px; margin-top: 7px; color: #cbd5e1; font-size: 10px; }
.pose-axis-legend span::before { content: ""; display: inline-block; width: 8px; height: 2px; margin-right: 4px; vertical-align: middle; background: currentColor; }
.pose-axis-x { color: #ff6b6b; }
.pose-axis-y { color: #51cf66; }
.pose-axis-z { color: #60a5fa; }

/* ── 右侧：CMA + 视频 ── */
#video-panel {
  grid-column: 3; grid-row: 1;
  display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 3px; overflow: hidden;
}
.media-pane {
  background: #ffffff; border-radius: 6px; border: 1px solid #dee2e6;
  display: flex; flex-direction: column; overflow: hidden; min-height: 0;
}
.media-title { color: #1890ff; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; padding: 6px 10px; border-bottom: 1px solid #dee2e6; flex-shrink: 0; }
#cma-wrap { flex: 1; position: relative; background: #111827; min-height: 0; overflow: hidden; }
#cma-canvas { width: 100%; height: 100%; display: block; }
#cma-none {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #9ca3af; font-size: 12px; background: #111827;
}
#cma-pose-overlay {
  position: absolute; top: 7px; left: 7px; z-index: 3; pointer-events: none;
  min-width: 210px; max-width: min(300px, calc(100% - 14px));
  background: rgba(12, 18, 27, 0.82); border: 1px solid rgba(148, 163, 184, 0.28);
  color: #e5edf7; border-radius: 6px; padding: 7px 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
#cma-pose-overlay.hidden { display: none; }
#cma-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#cma-hint { position: absolute; bottom: 5px; right: 7px; color: #9ca3af; font-size: 10px; pointer-events: none; }
#video-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#video-img { width: 100%; height: 100%; object-fit: cover; display: none; }
#video-none { color: #bfbfbf; font-size: 12px; }

/* ── 底部：曲线图 ── */
#bottom {
  grid-column: 2 / 4; grid-row: 2;
  background: #ffffff; border-radius: 6px; border: 1px solid #dee2e6;
  overflow: hidden;
}

/* 曲线图 */
#curve-wrap { padding: 8px 10px; height: 100%; display: flex; flex-direction: column; gap: 4px; }
#curve-canvas { width: 100%; height: 100%; min-height: 0; flex: 1; display: block; }

/* ── 加载遮罩 ── */
#loading {
  position: fixed; inset: 0; background: rgba(228,231,235,0.92);
  display: flex; align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 12px;
}
#loading.hidden { display: none; }
.spinner { width: 36px; height: 36px; border: 3px solid #d9d9d9; border-top-color: #1890ff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-msg { color: #7f8c8d; font-size: 13px; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-msg">初始化…</div>
</div>

<div id="topbar">
  <h1>真人Lance数据可视化</h1>
  <div id="traj-search-wrap">
  <input id="traj-search" type="text" placeholder="搜索轨迹名…" autocomplete="off">
  <div id="traj-dropdown"></div>
  </div>
  <div class="search-mode" aria-label="搜索模式">
    <button class="search-mode-btn active" data-search-mode="name" type="button">名称</button>
    <button class="search-mode-btn" data-search-mode="uuid" type="button">UUID</button>
  </div>
  <button class="top-btn" id="btn-toggle-index" title="显示/隐藏轨迹 index">IDX</button>
  <div id="index-detail-panel"></div>
  <span id="traj-info"></span>
  <div id="source-wrap">
    <div id="source-picker-wrap">
      <input id="source-path" type="text" placeholder="选择或输入 Lance 数据源" autocomplete="off">
      <div id="source-dropdown"></div>
    </div>
    <button class="top-btn" id="btn-source-browse">浏览</button>
    <button class="top-btn" id="btn-source-load">加载</button>
  </div>
</div>

<div id="source-modal" class="hidden">
  <div class="source-dialog">
    <div class="source-dialog-head">
      <div class="source-dialog-title">选择 Lance 数据源</div>
      <button class="top-btn" id="btn-source-close">关闭</button>
    </div>
    <div class="source-browser-bar">
      <input id="browser-path" type="text" autocomplete="off">
      <button class="top-btn" id="btn-browser-open">打开</button>
      <button class="top-btn" id="btn-browser-up">上级</button>
    </div>
    <div id="browser-roots"></div>
    <div id="browser-list"></div>
  </div>
</div>

<div id="main">
  <!-- 左侧控制 -->
  <div id="controls">
    <div class="sec">
      <div class="sec-title">帧控制</div>
      <input type="range" id="frame-slider" min="0" max="0" value="0">
      <div id="frame-label">帧 0 / 0</div>
      <div class="play-row">
        <button class="btn" id="btn-play">▶ 播放</button>
        <button class="btn" id="btn-pause">⏸ 暂停</button>
      </div>
    </div>
    <div class="sec">
      <div class="sec-title">3D 显示</div>
      <div class="cb-group">
        <label class="cb-row"><input type="checkbox" id="cb-mano-mesh" checked> MANO Mesh</label>
        <label class="cb-row"><input type="checkbox" id="cb-mano-joints"> MANO Joints</label>
        <label class="cb-row"><input type="checkbox" id="cb-urdf-joints"> URDF Joints</label>
        <label class="cb-row"><input type="checkbox" id="cb-urdf-mesh"> URDF Mesh</label>
        <label class="cb-row"><input type="checkbox" id="cb-object" checked> Object</label>
        <label class="cb-row"><input type="checkbox" id="cb-object-axes" checked> Object Pose Axis</label>
        <label class="cb-row"><input type="checkbox" id="cb-grid" checked> 网格</label>
      </div>
    </div>
    <div class="sec">
      <div class="sec-title">视频</div>
      <select class="small" id="cam-select"></select>
      <select class="small" id="stream-select">
        <option value="color">彩色</option>
        <option value="depth">深度</option>
      </select>
    </div>
    <div class="sec">
      <div class="sec-title">数据曲线</div>
      <select class="small" id="curve-select" multiple></select>
    </div>
  </div>

  <!-- 3D 视口 -->
  <div id="viewport">
    <canvas id="three-canvas"></canvas>
    <div id="object-pose-overlay" class="hidden">
      <div class="pose-title"><span>objects pose</span><span>lance raw</span></div>
      <div class="pose-grid">
        <span class="pose-label">pos</span>
        <span id="obj-pos-x" class="pose-value">--</span>
        <span id="obj-pos-y" class="pose-value">--</span>
        <span id="obj-pos-z" class="pose-value">--</span>
        <span class="pose-label">rot_aa</span>
        <span id="obj-rot-x" class="pose-value">--</span>
        <span id="obj-rot-y" class="pose-value">--</span>
        <span id="obj-rot-z" class="pose-value">--</span>
      </div>
      <div class="pose-axis-legend">
        <span class="pose-axis-x">X</span>
        <span class="pose-axis-y">Y</span>
        <span class="pose-axis-z">Z</span>
      </div>
    </div>
    <div id="axis-labels" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;"></div>
    <div id="viewport-hint">左键旋转 · 右键平移 · 滚轮缩放</div>
  </div>

  <!-- CMA + 视频 -->
  <div id="video-panel">
    <div class="media-pane">
      <div class="media-title">CMA 原始数据</div>
      <div id="cma-wrap">
        <canvas id="cma-canvas"></canvas>
        <div id="cma-pose-overlay" class="hidden">
          <div class="pose-title"><span>body pose</span><span>cma raw</span></div>
          <div class="pose-grid">
            <span class="pose-label">pos</span>
            <span id="cma-pos-x" class="pose-value">--</span>
            <span id="cma-pos-y" class="pose-value">--</span>
            <span id="cma-pos-z" class="pose-value">--</span>
            <span class="pose-label">rot_aa</span>
            <span id="cma-rot-x" class="pose-value">--</span>
            <span id="cma-rot-y" class="pose-value">--</span>
            <span id="cma-rot-z" class="pose-value">--</span>
          </div>
          <div class="pose-axis-legend">
            <span class="pose-axis-x">X</span>
            <span class="pose-axis-y">Y</span>
            <span class="pose-axis-z">Z</span>
          </div>
        </div>
        <div id="cma-labels"></div>
        <div id="cma-hint">左键旋转 · 右键平移 · 滚轮缩放</div>
        <span id="cma-none">无 CMA 数据</span>
      </div>
    </div>
    <div class="media-pane">
      <div class="media-title">视频流</div>
      <div id="video-wrap">
        <img id="video-img" alt="">
        <span id="video-none">无视频</span>
      </div>
    </div>
  </div>

  <!-- 底部：曲线 -->
  <div id="bottom">
    <div id="curve-wrap">
      <canvas id="curve-canvas"></canvas>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from './static/three.module.min.js';

// ════════════════════════════════════════════════════════
// 全局状态
// ════════════════════════════════════════════════════════
const S = {
  datasetSessionId: sessionStorage.getItem('humanVizDatasetSessionId') || '',
  trajIndex: null,
  totalFrames: 0,
  frameIdx: 0,
  numCameras: 0,
  curveData: {},
  lancePath: '',
  playTimer: null,
  _playing: false,
  playFps: 15,
  showTrajectoryIndex: false,
  currentTrajectoryInfoBase: '',
  currentIndexData: null,
  searchMode: 'name',
};

// ════════════════════════════════════════════════════════
// 工具
// ════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
async function apiFetch(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) {
    let detail = '';
    try {
      const err = await r.json();
      detail = err.detail ? `: ${err.detail}` : '';
    } catch {}
    throw new Error(`${r.status} ${url}${detail}`);
  }
  return r.json();
}
function setDatasetSessionId(sessionId) {
  S.datasetSessionId = sessionId || '';
  if (S.datasetSessionId && S.datasetSessionId !== 'default') {
    sessionStorage.setItem('humanVizDatasetSessionId', S.datasetSessionId);
  } else {
    sessionStorage.removeItem('humanVizDatasetSessionId');
  }
}
function withSession(url) {
  if (!S.datasetSessionId) return url;
  const sep = url.includes('?') ? '&' : '?';
  return `${url}${sep}session_id=${encodeURIComponent(S.datasetSessionId)}`;
}

// 竞态保护：每次 refreshFrame 生成唯一序号，过时响应直接丢弃
let _frameSeq = 0;
let _frameAbort = null;
let _browserState = { path: '', parent: null, roots: [] };
let _recentLanceRecords = [];
function showLoading(msg) { $('loading-msg').textContent = msg; $('loading').classList.remove('hidden'); }
function hideLoading() { $('loading').classList.add('hidden'); }
function stopPlay() {

function makeObjectPoseAxes() {
  const group = new THREE.Group();
  const specs = [
    ['x', 0xff6b6b],
    ['y', 0x51cf66],
    ['z', 0x60a5fa],
  ];
  specs.forEach(([key, color]) => {
    const arrow = new THREE.ArrowHelper(
      OBJECT_AXIS_DIRECTIONS[key],
      new THREE.Vector3(0, 0, 0),
      objectAxesLength,
      color,
      objectAxesLength * 0.22,
      objectAxesLength * 0.08
    );
    arrow.userData.axisKey = key;
    arrow.traverse(child => {
      if (child.material) {
        child.material.depthTest = false;
        child.material.depthWrite = false;
      }
      child.renderOrder = 20;
    });
    group.add(arrow);
  });
  group.visible = false;
  scene.add(group);
  return group;
}

function objectPoseToThree(pos, rotAa) {
  const position = new THREE.Vector3(pos[0], pos[2], -pos[1]);
  const angle = Math.hypot(rotAa[0], rotAa[1], rotAa[2]);
  const quaternion = new THREE.Quaternion();
  if (angle > 1e-8) {
    const axis = new THREE.Vector3(rotAa[0] / angle, rotAa[2] / angle, -rotAa[1] / angle);
    quaternion.setFromAxisAngle(axis, angle);
  }
  return { position, quaternion, angle };
}

function applyObjectPose(obj, pose) {
  const { position, quaternion } = objectPoseToThree(pose.pos, pose.rot_aa);
  obj.position.copy(position);
  obj.quaternion.copy(quaternion);
}

function updateObjectPoseOverlay(pose) {
  const overlay = $('object-pose-overlay');

}

function setMesh(obj, data) {
  if (!data) { obj.visible = false; return; }
  const pos = new Float32Array(data.x.length * 3);
  for (let i = 0; i < data.x.length; i++) {
    pos[i*3] = data.x[i]; pos[i*3+1] = data.z[i]; pos[i*3+2] = -data.y[i];
  }
  obj.geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  if (data.i) {
    const idx = new Uint32Array(data.i.length * 3);
    for (let f = 0; f < data.i.length; f++) {
      idx[f*3] = data.i[f]; idx[f*3+1] = data.j[f]; idx[f*3+2] = data.k[f];
    }
    obj.geometry.setIndex(new THREE.BufferAttribute(idx, 1));
  }
  obj.geometry.computeVertexNormals();
  obj.geometry.attributes.position.needsUpdate = true;
  obj.visible = true;
}
function setPoints(obj, data) {
  if (!data) { obj.visible = false; return; }

// ── 简易 Orbit 控制 ──
const orbit = (() => {
  const sph = new THREE.Spherical(1.37, 0.91, 1.50);
  const target = new THREE.Vector3(0, 0.3, 0);
  let mouse = null;
  const c = $('three-canvas');
  c.addEventListener('contextmenu', e => e.preventDefault());
  c.addEventListener('mousedown', e => { mouse = { x: e.clientX, y: e.clientY, btn: e.button }; });
  window.addEventListener('mouseup', () => { mouse = null; });
  window.addEventListener('mousemove', e => {
    if (!mouse) return;
    const dx = e.clientX - mouse.x, dy = e.clientY - mouse.y;
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (mouse.btn === 0) {
      sph.theta -= dx * 0.008; sph.phi -= dy * 0.008;
      sph.phi = Math.max(0.05, Math.min(Math.PI - 0.05, sph.phi));
    } else if (mouse.btn === 2) {
      // 右键平移：沿相机的右方向和上方向移动 target
      const scale = sph.radius * 0.001;
      const right = new THREE.Vector3();
      const up = new THREE.Vector3();
      camera.getWorldDirection(right); // 临时借用
      right.crossVectors(camera.up, right).normalize(); // 实际右方向（注意叉积顺序）
      up.copy(camera.up).normalize();
      target.addScaledVector(right, dx * scale);
      target.addScaledVector(up, dy * scale);
    }
    update();
  });
  c.addEventListener('wheel', e => {
    sph.radius = Math.max(0.05, sph.radius * (1 + e.deltaY * 0.001));
    update();
  }, { passive: true });
  function update() {
    camera.position.setFromSpherical(sph).add(target);
    camera.lookAt(target);
  }
  update();
  return { update };
})();

// ── 渲染循环 ──
const viewport = $('viewport');
const ro = new ResizeObserver(() => {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});
ro.observe(viewport);

(function renderLoop() {
  requestAnimationFrame(renderLoop);
  renderer.render(scene, camera);
  updateAxisLabels();
  updateObjectAxisLabels();
})();

  cmaLastFitKey = '';
  cmaLastFitPoints = [];
}

function fitCmaCamera(points, fitKey) {
  if (!points.length || fitKey === cmaLastFitKey) return;
  cmaLastFitKey = fitKey;
  cmaBounds.makeEmpty();
  points.forEach(p => cmaBounds.expandByPoint(p));
  cmaBounds.getCenter(cmaTmp);
  const sphere = new THREE.Sphere();
  cmaBounds.getBoundingSphere(sphere);
  const radius = Math.max(0.12, sphere.radius);
  cmaLastFitPoints = points.map(p => p.clone());
  cmaOrbit.setTarget(cmaTmp, radius);
  cmaCamera.near = Math.max(0.001, radius / 100);
  cmaCamera.far = Math.max(10, radius * 20);
  cmaCamera.updateProjectionMatrix();
}

function applyCma(d) {
  if (!d || !d.available) {
    setCmaUnavailable();
    return;
  }
  $('cma-none').style.display = 'none';

  const fitPoints = [];
  fitPoints.push(...setCmaPoints(CMA_OBJ.humanMarkers, d.human_markers));
  fitPoints.push(...setCmaLineSegments(CMA_OBJ.humanLines, d.human_lines));
  fitPoints.push(...setCmaPoints(CMA_OBJ.bodyMarkers, d.body_markers));
  const objectPose = d.object_pose || (
    d.object_transform
      ? { pos: d.object_transform.position, rot_aa: d.object_transform.rotation }
      : null
  );
  updateCmaPoseOverlay(objectPose);
  setCmaPoseAxes(objectPose);
  if (objectPose) {
    const origin = cmaPointToThree(objectPose.pos[0], objectPose.pos[1], objectPose.pos[2]);
    fitPoints.push(origin);
    setCmaAxesLength(0.12);
  }
  const fitKey = `${d.total_frames}:${d.human_markers?.x?.length || 0}:${d.body_markers?.x?.length || 0}`;
  fitCmaCamera(fitPoints, fitKey);
}

      const up = new THREE.Vector3();

  function setTarget(center, radius) {
    target.copy(center);
    sph.radius = Math.max(0.18, radius * 3.2);
    update();
  }
  update();
  return { update, setTarget };
})();

  fitCmaCamera(cmaLastFitPoints, fitKey);
});

function apply3D(d) {
  const hasUrdfMesh = d.urdf_meshes && d.urdf_meshes.length > 0;
  const objectPose = d.object_pose || (
    d.object_transform
      ? { pos: d.object_transform.position, rot_aa: d.object_transform.rotation }
      : null
  );
  setMesh(OBJ.manoMesh, hasUrdfMesh ? null : d.mano_mesh);
  setPoints(OBJ.manoJoints, d.mano_joints);
  setPoints(OBJ.urdfJoints, d.urdf_joints);
  updateObjectPoseOverlay(objectPose);
  setObjectPoseAxes(objectPose);

  // 物体网格：使用变换而不是每帧传输完整数据
  if (objectPose && d.object_transform && objectMeshData) {
    applyObjectPose(OBJ.objectMesh, objectPose);
    OBJ.objectMesh.visible = true;
  } else {
    OBJ.objectMesh.visible = false;
  }

  if (hasUrdfMesh) {
    d.urdf_meshes.forEach((m, i) => setMesh(urdfMeshObjs[i], m));
    for (let i = d.urdf_meshes.length; i < 25; i++) urdfMeshObjs[i].visible = false;
  } else { urdfMeshObjs.forEach(o => o.visible = false); }
  gridHelper.visible = $('cb-grid').checked;
}

async function refreshFrame() {
  // 取消上一次未完成的请求
  if (_frameAbort) _frameAbort.abort();
  _frameAbort = new AbortController();
  const sig = _frameAbort.signal;
  const seq = ++_frameSeq;

  $('frame-label').textContent = `帧 ${S.frameIdx} / ${S.totalFrames - 1}`;

  // 带 signal 的 fetch 包装
  const fetchWithSig = (url) => fetch(url, { signal: sig }).then(r => {
    if (!r.ok) throw new Error(`${r.status} ${url}`);
    return r.json();
  });

  try {
    const [d3, dv, dcma] = await Promise.all([
      (async () => {
        const p = new URLSearchParams({
          show_mano_mesh:   $('cb-mano-mesh').checked,
          show_mano_joints: $('cb-mano-joints').checked,
          show_urdf_joints: $('cb-urdf-joints').checked,
          show_urdf_mesh:   $('cb-urdf-mesh').checked,
          show_object:      $('cb-object').checked,
          show_origin:      false,
        });
        return fetchWithSig(withSession(`./api/frame/${S.trajIndex}/${S.frameIdx}?${p}`));
      })(),
      (async () => {
        if (S.trajIndex === null || S.numCameras === 0) return null;
        return fetchWithSig(withSession(`./api/video/${S.trajIndex}/${$('cam-select').value || 0}/${S.frameIdx}?stream=${$('stream-select').value}`))
          .catch(() => null);
      })(),
      (async () => {
        if (S.trajIndex === null) return null;
        return fetchWithSig(withSession(`./api/cma/${S.trajIndex}/${S.frameIdx}`))
          .catch(() => null);
      })(),
    ]);

    // 如果有更新的请求已经发出，丢弃本次结果
    if (seq !== _frameSeq) return;

    apply3D(d3);
    applyCma(dcma);
    if (dv) {
      $('video-img').src = dv.data_uri;
      $('video-img').style.display = 'block';
      $('video-none').style.display = 'none';
    } else if (S.numCameras > 0) {
      $('video-img').style.display = 'none';
      $('video-none').style.display = '';
    }
  } catch (e) {
    if (e.name === 'AbortError') return;  // 正常取消，忽略
    setCmaUnavailable();
  }
  drawCurve();
}

// 曲线图
// ════════════════════════════════════════════════════════
const CURVE_COLORS = ['#60a5fa','#34d399','#f87171','#fbbf24','#a78bfa','#fb923c','#38bdf8'];
const CURVE_PAD = { l: 42, r: 10, t: 6, b: 20 };

function frameFromCurveEvent(e) {
  const cvs = $('curve-canvas');
  const rect = cvs.getBoundingClientRect();
  const W = cvs.width;
  const iW = Math.max(1, W - CURVE_PAD.l - CURVE_PAD.r);
  const x = Math.max(CURVE_PAD.l, Math.min(W - CURVE_PAD.r, e.clientX - rect.left));
  const ratio = (x - CURVE_PAD.l) / iW;
  const maxFrame = Math.max(0, S.totalFrames - 1);
  return Math.max(0, Math.min(maxFrame, Math.round(ratio * maxFrame)));
}

function drawCurve() {
  const cvs = $('curve-canvas');
  const ctx = cvs.getContext('2d');
  const W = cvs.width, H = cvs.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0f1a'; ctx.fillRect(0, 0, W, H);

  const selected = Array.from($('curve-select').selectedOptions).map(o => o.value);
  if (!selected.length || !S.totalFrames) return;

  const datasets = selected.map(name => S.curveData[name]).filter(Boolean);
  if (!datasets.length) return;

  const allVals = datasets.flat();
  const minV = Math.min(...allVals), maxV = Math.max(...allVals);
  const range = maxV - minV || 1;

  const pad = CURVE_PAD;
  const iW = W - pad.l - pad.r, iH = H - pad.t - pad.b;

  const f2x = f => pad.l + f / (S.totalFrames - 1) * iW;
  const v2y = v => pad.t + iH - (v - minV) / range * iH;

  // 网格
  ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + iH * i / 4;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + iW, y); ctx.stroke();
    const val = maxV - range * i / 4;
    ctx.fillStyle = '#7f8c8d'; ctx.font = '10px sans-serif';
    ctx.fillText(val.toFixed(3), 0, y + 3);
  }

  // 曲线
  datasets.forEach((data, ci) => {
    ctx.strokeStyle = CURVE_COLORS[ci % CURVE_COLORS.length];
    ctx.lineWidth = 1.5; ctx.beginPath();
    data.forEach((v, f) => {
      const x = f2x(f), y = v2y(v);
      f === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  });

  // 当前帧线
  const cx = f2x(S.frameIdx);
  ctx.strokeStyle = '#1890ff'; ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(cx, pad.t); ctx.lineTo(cx, pad.t + iH); ctx.stroke();
  ctx.setLineDash([]);
}

const cvRo = new ResizeObserver(() => {
  const c = $('curve-canvas');
  const rect = c.getBoundingClientRect();
  c.width = Math.max(1, Math.floor(rect.width));
  c.height = Math.max(1, Math.floor(rect.height));
  drawCurve();
});
cvRo.observe($('curve-canvas'));

// 曲线画布拖动进度条
let curveDrag = false;
let curvePointerId = null;

async function updateFrameFromCurveEvent(e) {
  if (!S.totalFrames) return;
  const nextFrame = frameFromCurveEvent(e);
  if (nextFrame === S.frameIdx) return;
  stopPlay();
  S.frameIdx = nextFrame;
  $('frame-slider').value = S.frameIdx;
  await refreshFrame();
}

$('curve-canvas').addEventListener('pointerdown', async e => {
  if (e.button !== 0 || !S.totalFrames) return;
  e.preventDefault();
  curveDrag = true;
  curvePointerId = e.pointerId ?? null;
  if (curvePointerId !== null) $('curve-canvas').setPointerCapture?.(curvePointerId);
  await updateFrameFromCurveEvent(e);
});

window.addEventListener('pointermove', async e => {
  if (!curveDrag) return;
  if (curvePointerId !== null && e.pointerId !== undefined && e.pointerId !== curvePointerId) return;
  e.preventDefault();
  await updateFrameFromCurveEvent(e);
});

window.addEventListener('pointerup', e => {
  if (!curveDrag) return;
  if (curvePointerId !== null && e.pointerId !== curvePointerId) return;
  e.preventDefault();
  if (curvePointerId !== null && $('curve-canvas').hasPointerCapture?.(curvePointerId)) {
    $('curve-canvas').releasePointerCapture(curvePointerId);
  }
  curveDrag = false;
  curvePointerId = null;
});

window.addEventListener('pointercancel', e => {
  if (curvePointerId !== null && e.pointerId !== curvePointerId) return;
  curveDrag = false;
  curvePointerId = null;
});

    chip.onclick = () => browseDataSource(root);

  });

    list.appendChild(row);

    S.numCameras = info.num_cameras;

        OBJ.objectMesh.geometry.computeBoundingSphere();
        setObjectAxesLength((OBJ.objectMesh.geometry.boundingSphere?.radius || 0.12) * 0.55);
      }
    } else {
      objectMeshData = null;
      OBJ.objectMesh.visible = false;
      setObjectAxesLength(0.12);
    }

    S.currentTrajectoryInfoBase = info.label || `${info.title}  ·  ${info.subtitle}  ·  ${info.total_frames} 帧`;
    renderTrajectoryInfo();
    renderIndexDetails();
    $('frame-slider').max = info.total_frames - 1;
    $('frame-slider').value = 0;

    // 摄像头
    $('cam-select').innerHTML = '';
    for (let i = 0; i < info.num_cameras; i++) {
      const o = document.createElement('option');
      o.value = i; o.textContent = `相机 ${i}`; $('cam-select').appendChild(o);
    }

    // 曲线选项
    const opts = info.curve_options || [];
    $('curve-select').innerHTML = '';
    const defaults = ['mano.global_pos.x','mano.global_pos.y','mano.global_pos.z'];
    opts.forEach(name => {
      const o = document.createElement('option');
      o.value = name; o.textContent = name;
      if (defaults.includes(name)) o.selected = true;
      $('curve-select').appendChild(o);
    });


    // 预取曲线数据（批量获取）
    showLoading('预取曲线数据…');
    try {
      const allCurves = await apiFetch(withSession(`./api/curves/${index}/all`));
      S.curveData = allCurves;
    } catch (e) {
      console.error('批量获取曲线失败:', e);
    }

    await refreshFrame();
  } finally {
    hideLoading();
  }
}

// ── 轨迹搜索下拉 ──
let _allTrajs = [];   // 全量数据，仅存 JS 数组，不创建 DOM
const SHOW_MAX = Infinity;

function trajectoryDisplayLabel(label, index) {
  return label;
}

function normalizeSearchText(value) {
  return String(value || '').normalize('NFKC').toLowerCase();
}

function compactSearchText(value) {
  return normalizeSearchText(value).replace(/[^a-z0-9\u4e00-\u9fff]+/g, '');
}

function searchableTrajectoryLabel(label) {
  return String(label || '').replace(/\s*-\s*(?:\d+帧|不可用)\s*$/, '');
}

function parseTrajectoryLabel(label) {
  const text = searchableTrajectoryLabel(label);
  const match = text.match(/^(\d+):\s*(.*?)\s+\((.*?)\)(?:\s*\/\s*(.*))?$/);
  return {
    rowIndex: match?.[1] || '',
    objectName: match?.[2] || '',
    operator: match?.[3] || '',
    gesture: match?.[4] || '',
  };
}

function subsequenceScore(needle, haystack) {
  if (!needle) return 0;
  let pos = 0;
  let first = -1;
  let last = -1;
  let gaps = 0;
  for (const ch of needle) {
    const found = haystack.indexOf(ch, pos);
    if (found === -1) return null;
    if (first === -1) first = found;
    if (last !== -1) gaps += Math.max(0, found - last - 1);
    last = found;
    pos = found + 1;
  }
  return 120 - first * 2 - gaps;
}

function trajectorySearchScore(traj, keyword) {
  const query = normalizeSearchText(keyword).trim();
  const compactQuery = compactSearchText(query);
  if (!compactQuery) return 0;

  const label = searchableTrajectoryLabel(traj.label);
  const normalizedLabel = normalizeSearchText(label);
  const orderedCompact = compactSearchText(label);

  if (normalizedLabel.includes(query)) return 1000 - String(traj.index).length;
  if (orderedCompact.includes(compactQuery)) return 900 - orderedCompact.indexOf(compactQuery);

  const orderedSubseq = subsequenceScore(compactQuery, orderedCompact);
  if (orderedSubseq === null) return null;

  const parsed = parseTrajectoryLabel(traj.label);
  const objectSubseq = subsequenceScore(compactQuery, compactSearchText(parsed.objectName));
  if (objectSubseq !== null) return 860 + objectSubseq;

  const objectGestureSubseq = subsequenceScore(
    compactQuery,
    compactSearchText(`${parsed.objectName} ${parsed.gesture}`)
  );
  if (objectGestureSubseq !== null) return 760 + objectGestureSubseq;

  return 620 + orderedSubseq;
}

function uuidSearchKey(value) {
  return String(value || '').toLowerCase().replace(/[^a-f0-9]+/g, '');
}

function trajectoryUuidSearchScore(traj, keyword) {
  const query = uuidSearchKey(keyword);
  if (!query) return 0;
  const uuid = uuidSearchKey(traj.uuid);
  if (!uuid) return null;
  const pos = uuid.indexOf(query);
  return pos === -1 ? null : 1000 - pos;
}

function filterTrajectories(keyword) {
  const kw = keyword.trim();
  if (!kw) return _allTrajs;
  const scoreFn = S.searchMode === 'uuid' ? trajectoryUuidSearchScore : trajectorySearchScore;
  return _allTrajs
    .map(traj => ({ ...traj, _score: scoreFn(traj, kw) }))
    .filter(traj => traj._score !== null)
    .sort((a, b) => b._score - a._score || a.index - b.index);
}

function setTrajectorySearchMode(mode) {
  S.searchMode = mode === 'uuid' ? 'uuid' : 'name';
  document.querySelectorAll('.search-mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.searchMode === S.searchMode);
  });
  $('traj-search').placeholder = S.searchMode === 'uuid' ? '搜索 UUID…' : '搜索轨迹名…';
  $('traj-search').value = '';
  renderDropdown('');
}

function renderDropdown(keyword) {
  const matched = filterTrajectories(keyword);
  const items = matched.slice(0, SHOW_MAX);
  const dd = $('traj-dropdown');
  dd.innerHTML = '';
  if (!items.length) {
    dd.innerHTML = '<div class="traj-item" style="color:#bfbfbf">无匹配结果</div>';
  } else {
    items.forEach(({ label, index }) => {
      const el = document.createElement('div');
      el.className = 'traj-item';
      el.textContent = trajectoryDisplayLabel(label, index);
      if (index === S.trajIndex) el.classList.add('active');
      el.onclick = () => {
        $('traj-search').value = label;
        dd.classList.remove('open');
        loadTrajectory(index);
      };
      dd.appendChild(el);
    });
    if (matched.length > SHOW_MAX) {
      const hint = document.createElement('div');
      hint.className = 'traj-item';
      hint.style.color = '#bfbfbf';
      hint.textContent = `…还有 ${matched.length - SHOW_MAX} 条，请继续输入筛选`;
      dd.appendChild(hint);
    }
  }
  dd.classList.add('open');
}

$('traj-search').addEventListener('input', e => renderDropdown(e.target.value));
$('traj-search').addEventListener('focus', e => {
  e.target.select();
  renderDropdown('');
});
document.querySelectorAll('.search-mode-btn').forEach(btn => {
  btn.addEventListener('click', () => setTrajectorySearchMode(btn.dataset.searchMode));
});
$('btn-toggle-index').onclick = () => {
  S.showTrajectoryIndex = !S.showTrajectoryIndex;
  $('btn-toggle-index').classList.toggle('active', S.showTrajectoryIndex);
  renderTrajectoryInfo();
  renderIndexDetails();
};
document.addEventListener('click', e => {
  if (!$('traj-search-wrap').contains(e.target)) $('traj-dropdown').classList.remove('open');
  if (!$('source-picker-wrap').contains(e.target)) $('source-dropdown').classList.remove('open');
});

$('btn-source-load').onclick = () => loadDatasetFromPath(resolveSourceInputPath());
$('source-path').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadDatasetFromPath(resolveSourceInputPath());
});
$('source-path').addEventListener('input', e => {
  e.target.dataset.selectedPath = '';
  e.target.dataset.selectedName = '';
  renderSourceDropdown(e.target.value);
});
$('source-path').addEventListener('focus', async e => {
  if (!_recentLanceRecords.length) await fetchRecentDatasets();
  renderSourceDropdown(e.target.value);
});
$('btn-source-browse').onclick = async () => {
  $('source-modal').classList.remove('hidden');
  try {
    await browseDataSource(resolveSourceInputPath());
  } catch {
    await browseDataSource();
  }
};
$('btn-source-close').onclick = () => $('source-modal').classList.add('hidden');
$('source-modal').addEventListener('mousedown', e => {
  if (e.target === $('source-modal')) $('source-modal').classList.add('hidden');
});
$('btn-browser-open').onclick = () => browseDataSource($('browser-path').value.trim());
$('browser-path').addEventListener('keydown', e => {
  if (e.key === 'Enter') browseDataSource($('browser-path').value.trim());
});
$('btn-browser-up').onclick = () => {
  if (_browserState.parent) browseDataSource(_browserState.parent);
};

['cam-select','stream-select'].forEach(id => $(id).onchange = refreshFrame);

['cb-mano-mesh','cb-mano-joints','cb-urdf-joints','cb-urdf-mesh','cb-object','cb-object-axes','cb-grid']
  .forEach(id => $(id).onchange = refreshFrame);

$('curve-select').onchange = drawCurve;

$('btn-play').onclick = () => {
  if (S._playing) return; // 防止重复点击
  stopPlay();
  S._playing = true;
  const interval = 10; // 原始 CMA 数据固定 100Hz，每两帧间隔 0.01 秒
  const startFrame = S.frameIdx;
  const startTime = performance.now();

  function nextDueDelay() {
    const elapsed = performance.now() - startTime;
    const elapsedFrames = Math.floor(elapsed / interval);
    const nextFrame = Math.min(S.totalFrames - 1, startFrame + elapsedFrames + 1);
    const nextDueTime = startTime + (nextFrame - startFrame) * interval;
    return Math.max(0, nextDueTime - performance.now());
  }

  async function step() {
    if (!S._playing) return;
    if (S.frameIdx >= S.totalFrames - 1) { stopPlay(); $('btn-play').textContent = '▶ 播放'; return; }
    const elapsed = performance.now() - startTime;
    const targetFrame = Math.min(
      S.totalFrames - 1,
      startFrame + Math.floor(elapsed / interval)
    );
    if (targetFrame <= S.frameIdx) {
      S.playTimer = setTimeout(step, nextDueDelay());
      return;
    }
    S.frameIdx = targetFrame;
    $('frame-slider').value = S.frameIdx;
    await refreshFrame();
    if (!S._playing) return;
    if (S.frameIdx >= S.totalFrames - 1) { stopPlay(); $('btn-play').textContent = '▶ 播放'; return; }
    S.playTimer = setTimeout(step, nextDueDelay());
  }
  $('btn-play').textContent = '⏸ 播放中';
  S.playTimer = setTimeout(step, interval);
};
$('btn-pause').onclick = () => { stopPlay(); $('btn-play').textContent = '▶ 播放'; };

// ════════════════════════════════════════════════════════
// 启动
// ════════════════════════════════════════════════════════
(async () => {
  try {
    showLoading('初始化…');
    try {
      const current = await apiFetch(withSession('./api/dataset/current'));
      setDatasetSessionId(current.session_id || S.datasetSessionId);
      S.lancePath = current.lance_path || '';
    } catch {}
    await fetchRecentDatasets();
    if (S.lancePath) {
      const currentRecord = _recentLanceRecords.find(item => item.dataset_path === S.lancePath);
      $('source-path').value = currentRecord?.dataset_name || currentRecord?.dataset_path || '';
      $('source-path').dataset.selectedPath = S.lancePath;
      $('source-path').dataset.selectedName = currentRecord?.dataset_name || currentRecord?.dataset_path || '';
      const trajs = await apiFetch(withSession('./api/trajectories'));
      setTrajectoryList(trajs);
      if (_allTrajs.length) {
        await loadTrajectory(_allTrajs[0].index);
      } else {
        clearTrajectoryVisuals();
        hideLoading();
      }
    } else {
      clearSourceSelection();
      clearTrajectoryVisuals();
      hideLoading();
    }
  } catch (e) { $('loading-msg').textContent = `错误: ${e.message}`; }
})();
</script>
