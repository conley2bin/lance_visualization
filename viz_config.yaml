# Lance 可视化服务配置文件
# 放置路径（按优先级查找）：
#   1. /data/viz_config.yaml（Docker 环境推荐）
#   2. 项目根目录 viz_config.yaml（本地运行推荐）
#
# 注意：环境变量 LANCE_DATASET / MANO_MODEL_PATH 优先级高于本文件。

paths:
  # Lance 数据集路径（必填）
  lance_dataset: /mnt/nas-222-project/mocap/releases/v0.5/trajectories_preprocessed.lance

  # MANO 手模型文件路径（.pkl 格式）
  # 使用左手数据集时改为 MANO_LEFT.pkl
  mano_model: /app/assets/models/MANO_RIGHT.pkl

  # URDF 模型路径（可选）
  # 填写后可在 3D 视口中渲染机器人关节/网格，留空则不渲染
  urdf: ""

  # 物体网格路径（可选）
  # 通常从 assets/objects/ 自动读取，一般无需填写
  object_mesh: ""

  # 资源根目录（assets/ 所在的父目录）
  # Docker 环境下通常为 /app，本地运行时为项目根目录
  project_root: /app

viewer:
  # 当前后端 adapter 类型；后续可扩展 parquet / tactile / dex-hand 等实现
  type: lance

defaults:
  # 服务启动后默认选中的轨迹索引
  trajectory_index: 0

  # 默认摄像头索引（0 表示第一个摄像头）
  camera_index: 0

  # 默认视频流类型：color（彩色）或 depth（深度）
  video_stream: color

  # 自动播放帧率（FPS）
  playback_fps: 15

  # 手型：right（右手）或 left（左手）
  # 需与 paths.mano_model 中的模型文件对应
  hand: right
