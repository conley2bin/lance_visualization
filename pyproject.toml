[project]
name = "lance-viz"
version = "0.1.0"
description = "Lance mocap data visualization (FastAPI + Three.js)"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Web 服务
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "psycopg2-binary>=2.9.11",
    # 数据处理
    "numpy>=1.24.0,<1.27.0",
    "pyarrow>=10.0.0",
    "pylance>=0.9.0",
    "pyyaml>=6.0",
    # 数据集加载
    "huggingface_hub>=0.19.0",
    "datasets>=2.0.0,<3.2.0",
    "tqdm",
    # 科学计算（>=1.15 的 wheel 在 glibc 2.41 上段错误，钉上限）
    "scipy>=1.7.0,<1.15",
    "six>=1.16.0",
    # 深度学习（CPU）
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # 3D 处理
    "trimesh>=3.20.0",
    "pin==2.6.21",
    # 图像处理
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    # XML（URDF）
    "lxml>=4.9.0",
    # MANO 依赖（GitHub 源码安装）
    "chumpy",
    "manotorch",
]

[tool.uv.sources]
chumpy = { git = "https://github.com/mattloper/chumpy" }
manotorch = { git = "https://github.com/lixiny/manotorch.git" }

# chumpy 的 setup.py 在构建期 import pip/numpy，但未声明构建依赖；在隔离构建环境中补上
[tool.uv.extra-build-dependencies]
chumpy = ["pip", "numpy", "setuptools", "wheel"]
